name: Publish to PyPI

# Publishes on a version tag only. PyPI versions are immutable, so publishing
# on every push would fail the second time. Bump __version__, tag, push the tag.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check the tag matches __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/agent_harness/__init__.py').read_text()).group(1))")"
          echo "tag=$tag  package=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match __version__ $version. Nothing published."
            exit 1
          fi

      - name: Install
        run: python -m pip install --upgrade build twine -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: python -m build

      - name: Validate artifacts
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required for Trusted Publishing. No API token is used or stored.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
