[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harnessed"
dynamic = ["version"]
description = "A runtime environment that coordinates context, memory, prompts, tools, guardrails, output formatting, and a bounded reasoning loop around an LLM."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "naveed" }]
keywords = ["agent", "llm", "harness", "guardrails", "tools", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Only needed to run examples/refund_agent.py. The library itself ships no model
# client -- you inject one, as the README's quickstart shows.
examples = ["anthropic>=0.40"]

[project.urls]
Homepage = "https://github.com/NaveedMunsif/agent-harness"
Repository = "https://github.com/NaveedMunsif/agent-harness"
Issues = "https://github.com/NaveedMunsif/agent-harness/issues"

[tool.hatch.version]
path = "src/agent_harness/__init__.py"

[tool.hatch.build.targets.sdist]
# Explicit allowlist. Keeps local notes and editor/tool config out of releases.
include = [
    "src/agent_harness",
    "tests",
    "examples",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
